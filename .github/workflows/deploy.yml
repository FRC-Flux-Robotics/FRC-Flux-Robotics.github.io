name: Build MkDocs Material Preview (/v2/)

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "mkdocs-v2"
  cancel-in-progress: false

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      - name: Build MkDocs into ./v2
        run: |
          rm -rf v2
          mkdocs build --strict -d v2
          touch .nojekyll

      - name: Commit and push ./v2 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A v2 .nojekyll
          if git diff --staged --quiet; then
            echo "No changes in /v2 build output."
          else
            git commit -m "Build MkDocs Material site into /v2 [skip ci]"
            git push origin HEAD:main
          fi
